{{- if .Values.bullmqExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bullmq-exporter
  labels:
    {{- include "bullmq.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bullmq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bullmq.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.bullmqExporter.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "blobscan.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bullmq-exporter
          image: {{ .Values.bullmqExporter.image.repository }}:{{ .Values.bullmqExporter.image.tag }}
          imagePullPolicy: {{ .Values.bullmqExporter.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 3000
              protocol: TCP
          env:
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "blobscan.fullname" . }}-env
                  key: REDIS_URI
            - name: REDIS_DB
              value: {{ .Values.bullmqExporter.databaseMapping | quote }}
          {{- with .Values.bullmqExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- end }}
