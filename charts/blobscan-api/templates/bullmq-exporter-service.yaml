{{- if .Values.bullmqExporter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: bullmq-exporter
  {{- with .Values.bullmqExporter.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "bullmq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "bullmq.selectorLabels" . | nindent 4 }}
{{- end }}
