{{- if .Values.bullmqExporter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: bullmq-exporter
  labels:
    {{- include "bullmq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "bullmq.selectorLabels" . | nindent 4 }}
{{- end }}
