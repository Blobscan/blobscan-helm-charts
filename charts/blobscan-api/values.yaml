# -- Overrides the chart's name
nameOverride: ""

# -- Overrides the chart's computed fullname
fullnameOverride: ""

# -- Number of replicas
replicas: 1

image:
  # -- blobscan-api container image repository
  repository: blossomlabs/blobscan-api
  # -- blobscan-api container image tag
  tag: latest
  # -- blobscan-api container pull policy
  pullPolicy: IfNotPresent

# -- Secret env variables injected via a created secret
secretEnv:
  # -- Redis connection URI for caching and queue management
  REDIS_URI: "redis://blobscan-redis-master:6379/1"
  # -- PostgreSQL connection string for the main database connection
  DATABASE_URL: "postgresql://postgres:postgres@blobscan-blobscandb:5432/blobscan?pgbouncer=true&sslmode=require"
  # -- Direct PostgreSQL connection string, used for Prisma direct database access
  DIRECT_URL: "postgresql://postgres:postgres@blobscan-blobscandb:5432/blobscan?sslmode=require"
  # -- Secret key used for session management and encryption
  SECRET_KEY: "supersecret"
  # -- Google Cloud service account key for authentication (JSON format)
  GOOGLE_SERVICE_KEY: ""
  # -- Username for OpenTelemetry authentication
  OTLP_AUTH_USERNAME: ""
  # -- Password for OpenTelemetry authentication
  OTLP_AUTH_PASSWORD: ""
  # -- API key for WeaveVM integration
  WEAVEVM_API_KEY: ""
  # -- RPC endpoint for the chain specified in ETH_PRICE_SYNCER_CHAIN_ID
  ETH_PRICE_SYNCER_CHAIN_JSON_RPC_URL: "http://polygon-rpc:8545"
  # -- Sentry DSN for API
  SENTRY_DSN_API: ""

# -- Ports
httpPort: 3001

# -- Command arguments
args: []

# -- Config file
# @default -- See `values.yaml`
# https://github.com/Blobscan/blobscan/blob/main/.env.example
config:
  # -- Ethereum network chain ID (1 for mainnet)
  CHAIN_ID: "1"
  # -- Ethereum network name (mainnet, holesky, sepolia, gnosis)
  NETWORK_NAME: "mainnet"
  # -- Base URL for the Blobscan API service
  BLOBSCAN_API_BASE_URL: "http://blobscan-api:3001"
  # -- Port on which the Blobscan API service listens
  BLOBSCAN_API_PORT: 3001
  # -- Enable PostgreSQL storage for blob data
  POSTGRES_STORAGE_ENABLED: "true"
  # -- Enable Swarm decentralized storage for blob data
  SWARM_STORAGE_ENABLED: "false"
  # -- Swarm batch ID for blob data storage in Swarm network
  SWARM_BATCH_ID: ""
  # -- Enable Google Cloud Storage for blob data
  GOOGLE_STORAGE_ENABLED: "false"
  # -- Google Cloud Storage bucket name for blob data storage
  GOOGLE_STORAGE_BUCKET_NAME: ""
  # -- Google Cloud project ID for blob data storage
  GOOGLE_STORAGE_PROJECT_ID: ""
  # -- Swarm Bee node endpoint for decentralized storage
  BEE_ENDPOINT: "http://localhost:1633"
  # -- Enable Swarm chunkstorm for batch uploads
  SWARM_CHUNKSTORM_ENABLED: "false"
  # -- Swarm chunkstorm endpoint URL
  SWARM_CHUNKSTORM_URL: ""
  # -- Protocol used for OpenTelemetry data export
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  # -- Endpoint URL for OpenTelemetry data export
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
  # -- Enable metrics collection and reporting
  METRICS_ENABLED: "true"
  # -- Enable distributed tracing
  TRACES_ENABLED: "false"
  # -- Log level (info, warning, error, debug)
  LOG_LEVEL: "info"
  # -- Enable the ETH price syncer job
  ETH_PRICE_SYNCER_ENABLED: false
  # -- Cron pattern for the job that periodically stores ETH price in database
  ETH_PRICE_SYNCER_CRON_PATTERN: "* * * * *"
  # -- ID of the chain where price feed contract is deployed on
  ETH_PRICE_SYNCER_CHAIN_ID: "137"
  # -- Contract address for the Chainlink ETH/USD price feed on the specified chain
  ETH_PRICE_SYNCER_ETH_USD_PRICE_FEED_CONTRACT_ADDRESS: "0xF9680D99D6C9589e2a93a78A04A279e509205945"
  # -- Maximum allowed age (in seconds) of the fetched price before it's considered stale
  ETH_PRICE_SYNCER_TIME_TOLERANCE: 60

# -- Additional env variables
extraEnv: []

# -- External ConfigMaps to mount as environment variables
# Example: ["blobscan-api-config"]
externalConfigMaps: []

# -- External Secrets to mount as environment variables
# Example: ["blobscan-api-secrets"]
externalSecrets: []

# -- Custom args for the blobscan-api container
customArgs: []

ingress:
  # -- Ingress resource for the HTTP API
  enabled: false
  # -- Annotations for Ingress
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress host
  hosts:
    - host: chart-example.local
      paths: []
  # -- Ingress TLS
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Command replacement for the blobscan-api container
customCommand: [] # Only change this if you need to change the default command

service:
  # -- Service type
  type: ClusterIP
  # -- Service annotations
  annotations: {}

# -- Affinity configuration for pods
affinity: {}

# -- Image pull secrets for Docker images
imagePullSecrets: []

# -- Annotations for the Deployment
annotations: {}

# -- Liveness probe
# @default -- See `values.yaml`
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 60
  periodSeconds: 120

# -- Readiness probe
# @default -- See `values.yaml`
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

# -- Node selector for pods
nodeSelector: {}

# -- Pod labels
podLabels: {}

# -- Pod annotations
podAnnotations: {}

# -- Extra Pod ports
extraPodPorts: []

# -- Pod priority class
priorityClassName: null

# -- Resource requests and limits
resources: {}
# limits:
#   cpu: 500m
#   memory: 2Gi
# requests:
#   cpu: 300m
#   memory: 1Gi

# -- The security context for pods
# @default -- See `values.yaml`
securityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# -- The security context for containers
# @default -- See `values.yaml`
containerSecurityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- How long to wait until the pod is forcefully terminated
terminationGracePeriodSeconds: 30

# -- Tolerations for pods
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Define the PodDisruptionBudget spec
# If not set then a PodDisruptionBudget will not be created
podDisruptionBudget: {}
# minAvailable: 1
# maxUnavailable: 1

# -- Additional init containers
initContainers: []
# - name: my-init-container
#   image: busybox:latest
#   command: ['sh', '-c', 'echo hello']

# -- Additional containers
extraContainers: []

# -- Additional volumes
extraVolumes: []

# -- Additional volume mounts
extraVolumeMounts: []

# -- Chunkstorm configuration for Swarm batch uploads
chunkstorm:
  # -- Number of chunkstorm replicas
  replicaCount: 1
  # -- Deployment strategy configuration for chunkstorm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # -- Chunkstorm container image repository
  repository: blossomlabs/chunkstorm
  # -- Chunkstorm container image tag
  tag: 0.2.0
  # -- Chunkstorm container pull policy
  pullPolicy: IfNotPresent
  # -- Path to the keystore file inside the container
  keystorePath: "/app/keystore.json"
  # -- Password for the keystore
  keystorePassword: ""
  # -- Path to the stamperstore directory (persistent volume)
  stamperstorePath: "/app/stamperstore"
  # -- Resource requests and limits for the chunkstorm container
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  # -- Persistent volume size for the stamperstore
  stamperstorePersistentVolume:
    enabled: true
    size: 1Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  # -- Service configuration for chunkstorm
  service:
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 3050
    # -- Service annotations
    annotations: {}
  # -- ServiceMonitor configuration for chunkstorm
  serviceMonitor:
    # -- Enable or disable the ServiceMonitor for chunkstorm
    enabled: false
    # -- Additional ServiceMonitor labels
    labels: {}
    # -- Additional ServiceMonitor annotations
    annotations: {}
    # -- ServiceMonitor scrape interval
    interval: 60s
    # -- ServiceMonitor TLS configuration
    tlsConfig: {}
    # -- ServiceMonitor scrape timeout
    scrapeTimeout: 30s
    # -- ServiceMonitor relabelings
    relabelings: []

# -- Additional ports. Useful when using extraContainers
extraPorts: []

serviceMonitor:
  # -- If true, a ServiceMonitor CRD is created for a prometheus operator
  # https://github.com/coreos/prometheus-operator
  enabled: false
  # -- Path to scrape
  path: /metrics
  # -- Additional ServiceMonitor labels
  labels: {}
  # -- Additional ServiceMonitor annotations
  annotations: {}
  # -- ServiceMonitor scrape interval
  interval: 15s
  # -- ServiceMonitor scheme
  scheme: http
  # -- ServiceMonitor TLS configuration
  tlsConfig: {}
  # -- ServiceMonitor scrape timeout
  scrapeTimeout: 30s
  # -- ServiceMonitor relabelings
  relabelings: []

# -- BullMQ Prometheus exporter configuration
bullmqExporter:
  # -- Enable or disable the BullMQ Prometheus exporter
  enabled: false
  # -- Service configuration for BullMQ exporter
  service:
    # -- Service annotations
    annotations: {}
  # -- Redis database and namespace to monitor, in the format "<db>:<namespace>"
  databaseMapping: "0:ethereum-prod"
  # -- Pod annotations for the BullMQ exporter
  podAnnotations: {}
  # -- Resource requests and limits for the BullMQ exporter
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 50m
    #   memory: 64Mi
  image:
    # -- BullMQ Prometheus exporter image repository
    repository: "blossomlabs/bullmq-prometheus"
    # -- BullMQ Prometheus exporter image tag
    tag: "latest"
    # -- BullMQ Prometheus exporter image pull policy
    pullPolicy: "IfNotPresent"
  # -- ServiceMonitor configuration for BullMQ exporter
  serviceMonitor:
    # -- Enable or disable the ServiceMonitor for BullMQ exporter
    enabled: false
    # -- Additional ServiceMonitor labels
    labels: {}
    # -- Additional ServiceMonitor annotations
    annotations: {}
    # -- ServiceMonitor scrape interval, defaults to main ServiceMonitor interval if not set
    interval: 60s
    # -- ServiceMonitor TLS configuration
    tlsConfig: {}
    # -- ServiceMonitor scrape timeout
    scrapeTimeout: 30s
    # -- ServiceMonitor relabelings
    relabelings: []
