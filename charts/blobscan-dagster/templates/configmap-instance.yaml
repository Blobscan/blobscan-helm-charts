{{- /*
Two copies of the instance config, differing only in should_autocreate_tables:

  <fullname>-instance         webserver   true: creates the storage tables on
                                          a fresh install
  <fullname>-instance-daemon  daemon      false

The daemon's copy matters for runs: the K8sRunLauncher runs in the daemon, and
a run pod gets the daemon's instance config serialized in its execute_run
arguments (instance_ref). It does not read any ConfigMap. With the setting
true, each storage object a run pod builds first checks its tables exist
(inspect().get_table_names()) and leaves that connection open: on staging a
one-week hourly_metrics backfill run held 64 idle connections, every one last
running that check, and the cluster reached max_connections (100).

The daemon waits for the webserver at start (see deployment-daemon.yaml), so
on a fresh install the tables exist before it runs anything.
*/}}
{{- range $daemon := list false true }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blobscan-dagster.fullname" $ }}-instance{{ if $daemon }}-daemon{{ end }}
  labels:
    {{- include "blobscan-dagster.labels" $ | nindent 4 }}
data:
  dagster.yaml: |
    scheduler:
      module: dagster.core.scheduler
      class: DagsterDaemonScheduler

    # Run and pool limits both live under `concurrency`: Dagster rejects
    # max_concurrent_runs in run_coordinator once a `concurrency` block exists.
    run_coordinator:
      module: dagster.core.run_coordinator
      class: QueuedRunCoordinator

    concurrency:
      runs:
        max_concurrent_runs: {{ $.Values.dagsterInstance.maxConcurrentRuns }}
        {{- with $.Values.dagsterInstance.tagConcurrencyLimits }}
        tag_concurrency_limits:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if not (kindIs "invalid" $.Values.dagsterInstance.poolDefaultLimit) }}
      pools:
        default_limit: {{ $.Values.dagsterInstance.poolDefaultLimit }}
      {{- end }}

    # Each run is a Kubernetes Job in the user code image (the code server
    # reports it as DAGSTER_CURRENT_IMAGE). The Job pod mounts this ConfigMap
    # as DAGSTER_HOME and gets the same environment as the code server, by
    # reference: no secret value is copied into the Job spec.
    run_launcher:
      module: dagster_k8s
      class: K8sRunLauncher
      config:
        instance_config_map: {{ include "blobscan-dagster.fullname" $ }}-instance-daemon
        dagster_home: /opt/dagster/dagster_home
        service_account_name: {{ include "blobscan-dagster.serviceAccountName" $ }}
        job_namespace: {{ $.Release.Namespace }}
        load_incluster_config: true
        image_pull_policy: {{ $.Values.usercode.image.pullPolicy }}
        {{- with $.Values.imagePullSecrets }}
        image_pull_secrets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        run_k8s_config:
          container_config:
            env:
              {{- include "blobscan-dagster.postgresEnv" $ | nindent 14 }}
              {{- include "blobscan-dagster.secretEnvRefs" $ | nindent 14 }}
              {{- with $.Values.usercode.extraEnv }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- with $.Values.containerSecurityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $.Values.runLauncher.resources }}
            resources:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          pod_spec_config:
            {{- with $.Values.securityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $.Values.nodeSelector }}
            nodeSelector:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $.Values.tolerations }}
            tolerations:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- with $.Values.runLauncher.podLabels }}
          pod_template_spec_metadata:
            labels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- with $.Values.runLauncher.jobSpecConfig }}
          job_spec_config:
            {{- toYaml . | nindent 12 }}
          {{- end }}

    # Runs execute in their own pods, whose DAGSTER_HOME is the read-only
    # ConfigMap above, and the webserver could not read a run pod's local files
    # anyway. Step stdout/stderr stays in the run pod's log (kubectl logs);
    # structured events still go to the event log in Postgres.
    compute_logs:
      module: dagster.core.storage.noop_compute_log_manager
      class: NoOpComputeLogManager

    run_storage:
      module: dagster_postgres.run_storage
      class: PostgresRunStorage
      config:
        {{- if $daemon }}
        should_autocreate_tables: false
        {{- end }}
        postgres_db:
          hostname:
            env: DAGSTER_POSTGRES_HOST
          username:
            env: DAGSTER_POSTGRES_USER
          password:
            env: DAGSTER_POSTGRES_PASSWORD
          db_name:
            env: DAGSTER_POSTGRES_DB
          port:
            env: DAGSTER_POSTGRES_PORT

    schedule_storage:
      module: dagster_postgres.schedule_storage
      class: PostgresScheduleStorage
      config:
        {{- if $daemon }}
        should_autocreate_tables: false
        {{- end }}
        postgres_db:
          hostname:
            env: DAGSTER_POSTGRES_HOST
          username:
            env: DAGSTER_POSTGRES_USER
          password:
            env: DAGSTER_POSTGRES_PASSWORD
          db_name:
            env: DAGSTER_POSTGRES_DB
          port:
            env: DAGSTER_POSTGRES_PORT

    event_log_storage:
      module: dagster_postgres.event_log
      class: PostgresEventLogStorage
      config:
        {{- if $daemon }}
        should_autocreate_tables: false
        {{- end }}
        postgres_db:
          hostname:
            env: DAGSTER_POSTGRES_HOST
          username:
            env: DAGSTER_POSTGRES_USER
          password:
            env: DAGSTER_POSTGRES_PASSWORD
          db_name:
            env: DAGSTER_POSTGRES_DB
          port:
            env: DAGSTER_POSTGRES_PORT

    telemetry:
      enabled: false
{{- end }}
