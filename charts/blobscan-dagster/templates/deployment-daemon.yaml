{{- if .Values.daemon.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blobscan-dagster.fullname" . }}-daemon
  labels:
    {{- include "blobscan-dagster.daemon.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "blobscan-dagster.daemon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blobscan-dagster.daemon.selectorLabels" . | nindent 8 }}
        {{- with .Values.daemon.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/instance: {{ include (print $.Template.BasePath "/configmap-instance.yaml") . | sha256sum }}
        checksum/workspace: {{ include (print $.Template.BasePath "/configmap-workspace.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.daemon.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "blobscan-dagster.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $waitForUsercode := and .Values.usercode.enabled .Values.waitForUsercode }}
      {{- if or $waitForUsercode .Values.initContainers }}
      initContainers:
        {{- if $waitForUsercode }}
        {{- include "blobscan-dagster.waitForUsercode" (list .Values.daemon.image $) | nindent 8 }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: daemon
          image: "{{ .Values.daemon.image.repository }}:{{ .Values.daemon.image.tag }}"
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          command: ["dagster-daemon"]
          args: ["run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DAGSTER_HOME
              value: "/opt/dagster/dagster_home"
            {{- include "blobscan-dagster.postgresEnv" . | nindent 12 }}
            {{- include "blobscan-dagster.secretEnvRefs" . | nindent 12 }}
          {{- if .Values.daemon.extraEnv }}
            {{- toYaml .Values.daemon.extraEnv | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          volumeMounts:
            # Writable DAGSTER_HOME: the image has none and the pod is not root.
            - name: dagster-home
              mountPath: /opt/dagster/dagster_home
            - name: dagster-instance
              mountPath: /opt/dagster/dagster_home/dagster.yaml
              subPath: dagster.yaml
            - name: dagster-workspace
              mountPath: /opt/dagster/dagster_home/workspace.yaml
              subPath: workspace.yaml
            {{- if .Values.daemon.extraVolumeMounts }}
            {{- toYaml .Values.daemon.extraVolumeMounts | nindent 12 }}
            {{- end }}
      {{- if .Values.extraContainers }}
        {{- toYaml .Values.extraContainers | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: dagster-home
          emptyDir: {}
        - name: dagster-instance
          configMap:
            name: {{ include "blobscan-dagster.fullname" . }}-instance
        - name: dagster-workspace
          configMap:
            name: {{ include "blobscan-dagster.fullname" . }}-workspace
        {{- if .Values.daemon.extraVolumes }}
        {{- toYaml .Values.daemon.extraVolumes | nindent 8 }}
        {{- end }}
{{- end }}
