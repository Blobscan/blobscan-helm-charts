{{- if .Values.dagsterInstance.poolLimits }}
# Applies dagsterInstance.poolLimits to the Dagster DB on every install and
# upgrade. Limits live in the database, not in dagster.yaml (see the comment in
# configmap-instance.yaml), so this keeps git the source of truth: a limit
# changed by hand is reset to the value in the values on the next upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "blobscan-dagster.fullname" . }}-pool-limits
  labels:
    {{- include "blobscan-dagster.labels" . | nindent 4 }}
    app.kubernetes.io/component: pool-limits
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "blobscan-dagster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pool-limits
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "blobscan-dagster.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pool-limits
          image: {{ include "blobscan-dagster.dagsterImage" (list .Values.daemon.image .) | quote }}
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- range $pool, $limit := .Values.dagsterInstance.poolLimits }}
              dagster instance concurrency set {{ $pool | quote }} {{ $limit | int }}
              {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DAGSTER_HOME
              value: "/opt/dagster/dagster_home"
            {{- include "blobscan-dagster.postgresEnv" . | nindent 12 }}
            {{- include "blobscan-dagster.secretEnvRefs" . | nindent 12 }}
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          volumeMounts:
            - name: dagster-home
              mountPath: /opt/dagster/dagster_home
            - name: dagster-instance
              mountPath: /opt/dagster/dagster_home/dagster.yaml
              subPath: dagster.yaml
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      volumes:
        - name: dagster-home
          emptyDir: {}
        - name: dagster-instance
          configMap:
            name: {{ include "blobscan-dagster.fullname" . }}-instance
{{- end }}
