{{- if .Values.webserver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blobscan-dagster.fullname" . }}-webserver
  labels:
    {{- include "blobscan-dagster.webserver.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webserver.service.type }}
  ports:
    - port: {{ .Values.webserver.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "blobscan-dagster.webserver.selectorLabels" . | nindent 4 }}
{{- end }}
