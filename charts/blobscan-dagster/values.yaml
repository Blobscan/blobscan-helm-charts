# -- Overrides the chart's name
nameOverride: ""

# -- Overrides the chart's computed fullname
fullnameOverride: ""

# -- Image pull secrets for Docker images
imagePullSecrets: []

# -- Annotations for the Deployments
annotations: {}

# -- Node selector for pods
nodeSelector: {}

# -- Tolerations for pods
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Topology Spread Constraints for pods
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []

# -- Affinity configuration for pods
affinity: {}

# -- The security context for pods
# @default -- See `values.yaml`
securityContext:
  fsGroup: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

# -- The security context for containers
# @default -- See `values.yaml`
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  # -- Specifies whether a service account should be created.
  # The K8sRunLauncher creates Jobs as this account, see `rbac.create`.
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Create the Role and RoleBinding the K8sRunLauncher needs to create run
  # Jobs and follow their pods. Without it every launched run fails.
  create: true

# ---------------------------------------------------------------------------
# Dagster instance configuration (dagster.yaml)
# ---------------------------------------------------------------------------
dagsterInstance:
  # -- Run coordinator max concurrent runs
  maxConcurrentRuns: 5
  # -- Run coordinator tag concurrency limits. The default is the one in
  # apps/dagster/dagster.yaml: at most 3 backfill runs, leaving room for the
  # scheduled ones while a backfill is in progress.
  # @default -- See `values.yaml`
  tagConcurrencyLimits:
    - key: "dagster/backfill"
      limit: 3
  # -- Default limit of every concurrency pool (`concurrency.pools.default_limit`).
  # Each metrics asset runs in its own pool (`metrics/<table>`), so 1 means at
  # most one run writes a metrics table at a time, whether scheduled,
  # automation or backfill. Without it Dagster leaves pools unlimited. Set to
  # null to drop it.
  poolDefaultLimit: 1

# ---------------------------------------------------------------------------
# Webserver (dagster-webserver)
# ---------------------------------------------------------------------------
webserver:
  # -- Enable the webserver deployment
  enabled: true
  image:
    # -- Webserver container image repository. The official image: it ships
    # dagster-webserver, dagster-daemon, dagster-postgres and dagster-k8s.
    repository: dagster/dagster-k8s
    # -- Webserver container image tag. Keep it on the dagster version the user
    # code image is locked to.
    tag: "1.12.19"
    # -- Webserver container pull policy
    pullPolicy: IfNotPresent
  # -- Number of webserver replicas
  replicaCount: 1
  # -- Webserver port
  port: 3000
  # -- Resource requests and limits
  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi
  # -- Pod labels
  podLabels: {}
  # -- Pod annotations
  podAnnotations: {}
  # -- Additional env variables
  extraEnv: []
  # -- Additional volume mounts
  extraVolumeMounts: []
  # -- Additional volumes
  extraVolumes: []
  service:
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 3000
  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /server_info
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  # -- Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /server_info
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10

# ---------------------------------------------------------------------------
# Daemon (dagster-daemon)
# ---------------------------------------------------------------------------
daemon:
  # -- Enable the daemon deployment
  enabled: true
  image:
    # -- Daemon container image repository. The official image: it ships
    # dagster-webserver, dagster-daemon, dagster-postgres and dagster-k8s.
    repository: dagster/dagster-k8s
    # -- Daemon container image tag. Keep it on the dagster version the user
    # code image is locked to.
    tag: "1.12.19"
    # -- Daemon container pull policy
    pullPolicy: IfNotPresent
  # -- Resource requests and limits
  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi
  # -- Pod labels
  podLabels: {}
  # -- Pod annotations
  podAnnotations: {}
  # -- Additional env variables
  extraEnv: []
  # -- Additional volume mounts
  extraVolumeMounts: []
  # -- Additional volumes
  extraVolumes: []

# ---------------------------------------------------------------------------
# User Code (gRPC server)
# ---------------------------------------------------------------------------
usercode:
  # -- Enable the user code deployment
  enabled: true
  image:
    # -- User code container image repository
    repository: blossomlabs/blobscan-dagster
    # -- User code container image tag
    tag: latest
    # -- User code container pull policy
    pullPolicy: IfNotPresent
  # -- Number of user code replicas
  replicaCount: 1
  # -- gRPC server port
  port: 4000
  # -- The dagster module to load definitions from
  module: "analytics.definitions"
  # -- Resource requests and limits
  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi
  # -- Pod labels
  podLabels: {}
  # -- Pod annotations
  podAnnotations: {}
  # -- Additional env variables
  extraEnv: []
  # -- Additional volume mounts
  extraVolumeMounts: []
  # -- Additional volumes
  extraVolumes: []
  service:
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 4000
  # -- Health check configuration
  healthCheck:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5

# ---------------------------------------------------------------------------
# Run launcher (K8sRunLauncher)
# ---------------------------------------------------------------------------
# Each run is a Job in the user code image, with the user code environment
# (postgres variables, secretEnv and usercode.extraEnv) and the pod and
# container security contexts above.
runLauncher:
  # -- Resource requests and limits for run pods
  resources: {}
  # -- Labels added to run pods
  podLabels: {}
  # -- Extra fields for the run Job spec, e.g. ttlSecondsAfterFinished or
  # backoffLimit. Dagster deletes finished Jobs after a day by default.
  jobSpecConfig: {}

# ---------------------------------------------------------------------------
# Secret env variables injected via a created secret
# ---------------------------------------------------------------------------
secretEnv: {}
  # DAGSTER_POSTGRES_PASSWORD: "dagster"

# ---------------------------------------------------------------------------
# PostgreSQL (Bitnami subchart)
# ---------------------------------------------------------------------------
postgresql:
  # -- Enable the PostgreSQL subchart. Off by default: Bitnami stopped
  # publishing its free images in 2025, so the subchart no longer pulls
  # without an image override. Use `externalPostgresql`.
  enabled: false
  auth:
    # -- PostgreSQL username
    username: dagster
    # -- PostgreSQL password
    password: dagster
    # -- PostgreSQL database name
    database: dagster
  primary:
    persistence:
      # -- Enable persistence for PostgreSQL
      enabled: true
      # -- Persistent volume size
      size: 8Gi
    service:
      ports:
        postgresql: 5432
    resources: {}

# ---------------------------------------------------------------------------
# External PostgreSQL (when postgresql.enabled is false)
# ---------------------------------------------------------------------------
externalPostgresql:
  # -- External PostgreSQL hostname
  host: ""
  # -- External PostgreSQL port
  port: 5432
  # -- External PostgreSQL database name
  database: "dagster"
  # -- External PostgreSQL username
  username: "dagster"
  # -- Existing Secret holding the password, e.g. the basic-auth Secret of a
  # CloudNativePG managed role. When empty, the password is read from
  # `secretEnv.DAGSTER_POSTGRES_PASSWORD`.
  existingSecret: ""
  # -- Key in `existingSecret` that holds the password
  existingSecretKey: password

# ---------------------------------------------------------------------------
# How long to wait until the pod is forcefully terminated
# ---------------------------------------------------------------------------
terminationGracePeriodSeconds: 30

# ---------------------------------------------------------------------------
# Init containers
# ---------------------------------------------------------------------------
# -- Additional init containers
initContainers: []

# ---------------------------------------------------------------------------
# Extra containers
# ---------------------------------------------------------------------------
# -- Additional containers
extraContainers: []
