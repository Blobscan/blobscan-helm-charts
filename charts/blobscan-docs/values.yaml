# -- Overrides the chart's name
nameOverride: ""

# -- Overrides the chart's computed fullname
fullnameOverride: ""

# -- Number of replicas
replicas: 1

image:
  # -- Docker image repository for blobscan-docs
  repository: blossomlabs/blobscan-docs
  # -- Docker image tag for blobscan-docs
  tag: latest
  # -- Docker image pull policy for blobscan-docs
  pullPolicy: IfNotPresent

# -- Environment variables to set in the container
env: {}

# -- Environment variables from secrets or configmaps
envFrom: []

# -- External ConfigMaps to mount as environment variables
externalConfigMaps: []

# -- External Secrets to mount as environment variables
externalSecrets: []

resources:
  # -- Resource limits for pods
  limits:
    # -- CPU limit
    cpu: 500m
    # -- Memory limit
    memory: 256Mi
  # -- Resource requests for pods
  requests:
    # -- CPU request
    cpu: 100m
    # -- Memory request
    memory: 128Mi

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity configuration for pods
affinity: {}

# -- Image pull secrets for Docker images
imagePullSecrets: []

# -- Annotations for the Deployment
deploymentAnnotations: {}

# -- Annotations for the Pod
podAnnotations: {}

# -- Pod labels
podLabels: {}

# -- Service account for the pod
serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  name: ""

# -- Configuration for the service
service:
  # -- Type of service
  type: ClusterIP
  # -- Port configuration for the service
  ports:
    # -- HTTP port
    http:
      port: 80
      targetPort: 3002
      protocol: TCP

# -- Ingress configuration
ingress:
  # -- Enable ingress resource
  enabled: false
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts and paths configuration
  hosts:
    - host: docs.blobscan.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []

# -- NetworkPolicy restricting ingress to this component's pods. Disabled by
# default; enable per-environment. Requires a policy-enforcing CNI (Cilium, or
# kube-router on k3s; plain flannel does not enforce it).
#
# NB: `from` empty does NOT mean default-deny here. The rule below still lists a
# port, and Kubernetes reads a rule with ports and no `from` as "this port, from
# anywhere" -- so flipping `enabled` alone restricts nothing. Default-deny needs
# BOTH empty, which is what blobscan-indexer does.
networkPolicy:
  enabled: false
  ingress:
    # Sources permitted to reach the ports below. Typically the ingress
    # controller namespace and the monitoring namespace.
    from: []
      # - namespaceSelector:
      #     matchLabels:
      #       kubernetes.io/metadata.name: ingress
      # - namespaceSelector:
      #     matchLabels:
      #       kubernetes.io/metadata.name: monitoring
    # Ports exposed to the sources above. 3002, NOT the 80 above: that is the
    # Service port, and NetworkPolicy filters at the pod, which listens on
    # 3002 (see the containerPort in deployment.yaml).
    ports:
      - port: 3002
        protocol: TCP

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: 3002
  initialDelaySeconds: 30
  periodSeconds: 10

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: 3002
  initialDelaySeconds: 10
  periodSeconds: 10
