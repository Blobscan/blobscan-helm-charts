{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blobscan-indexer.fullname" . }}
  labels:
    {{- include "blobscan-indexer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blobscan-indexer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or .Values.networkPolicy.ingress.from .Values.networkPolicy.ingress.ports }}
  ingress:
    # Allow ingress to this pod only from the configured sources/ports.
    - from:
        {{- with .Values.networkPolicy.ingress.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.ingress.ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
  {{- else }}
  # No sources/ports configured: default-deny all ingress to this pod.
  ingress: []
  {{- end }}
{{- end }}
