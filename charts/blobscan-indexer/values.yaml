# -- Overrides the chart's name
nameOverride: ""

# -- Overrides the chart's computed fullname
fullnameOverride: ""

image:
  # -- blobscan-indexer container image repository
  repository: blossomlabs/blobscan-indexer
  # -- blobscan-indexer container image tag
  tag: latest
  # -- blobscan-indexer container pull policy
  pullPolicy: IfNotPresent

# -- Secret env variables injected via a created secret
secretEnv:
  # -- Ethereum consensus layer (beacon chain) node endpoint URL
  BEACON_NODE_ENDPOINT: "http://beacon-node:5052"
  # -- Ethereum execution layer node endpoint URL
  EXECUTION_NODE_ENDPOINT: "http://execution-node:8545"
  # -- Secret key used for authentication and encryption
  SECRET_KEY: "supersecret"
  # -- Sentry DSN for error tracking and monitoring
  SENTRY_DSN: ""

# -- Command arguments
args: []

# -- Config file
# @default -- See `values.yaml`
# https://github.com/Blobscan/blobscan/blob/next/.env.example
config:
  # -- Blobscan API service endpoint URL
  BLOBSCAN_API_ENDPOINT: "http://blobscan-api:3001"
  # -- Ethereum network name (mainnet, holesky, sepolia, gnosis)
  NETWORK_NAME: "mainnet"
  # -- Slot number when Dencun fork activated (uncomment and set for testnets)
  DENCUN_FORK_SLOT: ""
  # -- Rust logging configuration for the blob indexer
  RUST_LOG: "blob_indexer=INFO"

# -- Additional env variables
extraEnv: []

# -- External ConfigMaps to mount as environment variables
# Example: ["blobscan-indexer-config"]
externalConfigMaps: []

# -- External Secrets to mount as environment variables
# Example: ["blobscan-indexer-secrets"]
externalSecrets: []

# -- Custom args for the blobscan-indexer container
customArgs: []

# -- Command replacement for the blobscan-indexer container
customCommand: [] # Only change this if you need to change the default command

service:
  # -- Service type
  type: ClusterIP

# -- Affinity configuration for pods
affinity: {}

# -- Image pull secrets for Docker images
imagePullSecrets: []

# -- Annotations for the Deployment
annotations: {}

# -- Node selector for pods
nodeSelector: {}

# -- Pod labels
podLabels: {}

# -- Pod annotations
podAnnotations: {}

# -- Extra Pod ports
extraPodPorts: []

# -- Pod priority class
priorityClassName: null

# -- Resource requests and limits
resources: {}
# limits:
#   cpu: 500m
#   memory: 2Gi
# requests:
#   cpu: 300m
#   memory: 1Gi

# -- The security context for pods
# @default -- See `values.yaml`
securityContext:
  fsGroup: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

# -- The security context for containers (Pod Security Standards "restricted"
# compliant by default). readOnlyRootFilesystem is left off because some
# components write to the filesystem; enable it per-deployment if supported.
# @default -- See `values.yaml`
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- NetworkPolicy restricting ingress to this component's pods. Disabled by
# default; enable per-environment. Requires a policy-enforcing CNI (e.g.
# Cilium on DOKS). The indexer is a background worker that serves no inbound
# traffic, so the default (empty from/ports) is full default-deny ingress.
networkPolicy:
  enabled: false
  ingress:
    # Add monitoring here if a metrics port is exposed via extraPodPorts.
    from: []
    ports: []
  # runAsUser: 1000

serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- How long to wait until the pod is forcefully terminated
terminationGracePeriodSeconds: 30

# -- Tolerations for pods
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Topology Spread Constraints for pods
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []

# -- Define the PodDisruptionBudget spec
# If not set then a PodDisruptionBudget will not be created
podDisruptionBudget: {}
# minAvailable: 1
# maxUnavailable: 1

# -- Additional init containers
initContainers: []
# - name: my-init-container
#   image: busybox:latest
#   command: ['sh', '-c', 'echo hello']

# -- Additional containers
extraContainers: []

# -- Additional volumes
extraVolumes: []

# -- Additional volume mounts
extraVolumeMounts: []

# -- Additional ports. Useful when using extraContainers
extraPorts: []

serviceMonitor:
  # -- If true, a ServiceMonitor CRD is created for a prometheus operator
  # https://github.com/coreos/prometheus-operator
  enabled: false
  # -- Path to scrape
  path: /metrics
  # -- Alternative namespace for ServiceMonitor
  namespace: null
  # -- Additional ServiceMonitor labels
  labels: {}
  # -- Additional ServiceMonitor annotations
  annotations: {}
  # -- ServiceMonitor scrape interval
  interval: 15s
  # -- ServiceMonitor scheme
  scheme: http
  # -- ServiceMonitor TLS configuration
  tlsConfig: {}
  # -- ServiceMonitor scrape timeout
  scrapeTimeout: 30s
  # -- ServiceMonitor relabelings
  relabelings: []
