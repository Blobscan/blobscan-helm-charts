apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blobscan-ipld.fullname" . }}
  labels:
    {{- include "blobscan-ipld.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # The state file and CAR archives live on a single RWO volume, so never run
  # two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "blobscan-ipld.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blobscan-ipld.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "blobscan-ipld.serviceAccountName" . }}
    {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
    {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
      {{- if .Values.initContainers }}
        {{- toYaml .Values.initContainers | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
          {{- if gt (len .Values.customCommand) 0 }}
            {{- toYaml .Values.customCommand | nindent 12}}
          {{- else }}
            {{- if gt (len .Values.args) 0 }}
            {{- toYaml .Values.args | nindent 12}}
            {{- end }}
          {{- end }}
          {{- if gt (len .Values.customArgs) 0 }}
          args:
            {{- toYaml .Values.customArgs | nindent 12}}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.DATA_DIR | default "/data" | quote }}
            - name: car
              mountPath: {{ .Values.config.CAR_DIR | default "/car" | quote }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
              protocol: TCP
            {{- if .Values.extraPodPorts }}
              {{ toYaml .Values.extraPodPorts | nindent 10 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          {{- range $key, $value := .Values.config }}
            {{- if ne ($value | toString) "" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- range $key, $value := .Values.secretEnv }}
            {{- if ne $value "" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "blobscan-ipld.fullname" $ }}-env
                  key: {{ $key }}
            {{- end }}
          {{- end }}
          {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
          {{- end }}

          {{- if .Values.externalConfigMaps }}
            {{- range .Values.externalConfigMaps }}
          envFrom:
            - configMapRef:
                name: {{ . }}
            {{- end }}
          {{- end }}

          {{- if .Values.externalSecrets }}
            {{- range .Values.externalSecrets }}
          envFrom:
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
      {{- if .Values.extraContainers }}
        {{ toYaml .Values.extraContainers | nindent 8}}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "blobscan-ipld.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: car
          emptyDir: {}
      {{- if .Values.extraVolumes }}
        {{ toYaml .Values.extraVolumes | nindent 8}}
      {{- end }}
