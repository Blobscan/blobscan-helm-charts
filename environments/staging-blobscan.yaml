blobscan-api:
    fullnameOverride: blobscan-api
    config:
        CHAIN_ID: "1"
        NETWORK_NAME: mainnet
        BLOBSCAN_API_BASE_URL: https://api.staging.blobscan.com
        # BLOBSCAN_API_BASE: "api.staging.blobscan.com"
        # BLOBSCAN_API_PORT  # unused
        POSTGRES_STORAGE_ENABLED: "false"
        SWARM_STORAGE_ENABLED: "true"
        SWARM_BATCH_ID: af022a2b1f585ff9cbc750fe514604d959b906f786323b0b54757523c8101ff3
        GOOGLE_STORAGE_ENABLED: "true"
        GOOGLE_STORAGE_BUCKET_NAME: ENC[AES256_GCM,data:vAvxzsh0nblz7HPWWQ0Aqg==,iv:AUHEgRPtrsIf5OqDe1xasXrw5XW2kfYN1TKa35y6C6A=,tag:33q+ECtWBKvfVHCwQEaFxw==,type:str]
